<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">AIUI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c70ff"/>
      <stop offset="1" stop-color="#4a3be0"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- The letter A, drawn as an agent linked to two steps -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 384 L256 136 L362 384"/>
    <path d="M197 274 L315 274"/>
  </g>

  <!-- Steps: the two blocks the agent can use -->
  <rect x="122" y="344" width="80" height="80" rx="18" fill="#ffffff"/>
  <rect x="310" y="344" width="80" height="80" rx="18" fill="#ffffff"/>

  <!-- The agent: the spark at the top -->
  <circle cx="256" cy="136" r="46" fill="#ffc94d"/>
</svg>
