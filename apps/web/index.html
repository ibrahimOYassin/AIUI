    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('aiui.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
      // Signed-in visitors go straight to the app: hide the ready-made public page until it starts.
      try { if (localStorage.getItem('aiui.token')) document.documentElement.dataset.session = '1'; } catch (e) {}
    </script>
    <style>
      html[data-session] [data-prerendered] { visibility: hidden; }
